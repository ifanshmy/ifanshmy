<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Now building TradeDesk, a calm private trading journal">
<style>
  .k { font: 600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #9aa1ad; letter-spacing: 2.5px; }
  .t { font: 800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: -1px; } .t tspan { fill: #ff5b2e; }
  .p { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9aa1ad; }
  .u { font: 600 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #ff5b2e; }
  .lbl { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #6b727e; letter-spacing: 2px; }
  .num { font: 700 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .chg { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .roll { animation: roll 15.600000000000001s infinite; }
  @keyframes roll { 0.00% { transform: translateY(0px); } 13.78% { transform: translateY(0px); animation-timing-function: cubic-bezier(.6,0,.2,1); } 16.67% { transform: translateY(-48px); } 30.45% { transform: translateY(-48px); animation-timing-function: cubic-bezier(.6,0,.2,1); } 33.33% { transform: translateY(-96px); } 47.12% { transform: translateY(-96px); animation-timing-function: cubic-bezier(.6,0,.2,1); } 50.00% { transform: translateY(-144px); } 63.78% { transform: translateY(-144px); animation-timing-function: cubic-bezier(.6,0,.2,1); } 66.67% { transform: translateY(-192px); } 80.45% { transform: translateY(-192px); animation-timing-function: cubic-bezier(.6,0,.2,1); } 83.33% { transform: translateY(-240px); } 97.12% { transform: translateY(-240px); animation-timing-function: cubic-bezier(.6,0,.2,1); } 100% { transform: translateY(-288px); } }
  .live { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
  .spark { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 15.600000000000001s linear infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 520; } 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
</style>
<defs>
  <clipPath id="numclip"><rect x="0" y="0" width="300" height="48"/></clipPath>
  <clipPath id="chipclip"><rect x="0" y="0" width="90" height="48"/></clipPath>
</defs>
<rect x=".5" y=".5" width="1199" height="229" rx="18" fill="#0d0f12" stroke="#2a2e35"/>
<circle cx="48" cy="50" r="4.5" fill="#34d399"/><circle class="live" cx="48" cy="50" r="4.5" fill="#34d399"/>
<text class="k" x="62" y="55">NOW BUILDING</text>
<text class="t" x="40" y="110">Trade<tspan>Desk</tspan></text>
<text class="p" x="40" y="146">A calm, private trading journal. Drop in a broker statement;</text>
<text class="p" x="40" y="172">it checks the maths, then updates your dashboard.</text>
<text class="u" x="40" y="204">ifanshmy.github.io/tradedesk  →</text>
<line x1="760" y1="34" x2="760" y2="196" stroke="#2a2e35"/>
<g transform="translate(800 40)">
  <text class="lbl" x="0" y="12">PORTFOLIO NAV · DEMO</text>
  <g transform="translate(0 22)" clip-path="url(#numclip)"><g class="roll"><text class="num" x="0" y="40">RM 8,484.08</text><text class="num" x="0" y="88">RM 8,512.40</text><text class="num" x="0" y="136">RM 8,497.15</text><text class="num" x="0" y="184">RM 8,560.92</text><text class="num" x="0" y="232">RM 8,603.37</text><text class="num" x="0" y="280">RM 8,571.80</text><text class="num" x="0" y="328">RM 8,484.08</text></g></g>
  <g transform="translate(270 22)" clip-path="url(#chipclip)"><g class="roll"><g transform="translate(0 0)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#34d399" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#34d399">+0.33%</text></g><g transform="translate(0 48)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#34d399" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#34d399">+0.67%</text></g><g transform="translate(0 96)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#f87171" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#f87171">−0.18%</text></g><g transform="translate(0 144)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#34d399" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#34d399">+0.75%</text></g><g transform="translate(0 192)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#34d399" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#34d399">+0.50%</text></g><g transform="translate(0 240)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#f87171" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#f87171">−0.37%</text></g><g transform="translate(0 288)"><rect x="0" y="16" width="78" height="26" rx="13" fill="#34d399" fill-opacity=".14"/><text class="chg" x="39" y="34" text-anchor="middle" fill="#34d399">+0.33%</text></g></g></g>
  <path class="spark" d="M0 152 C30 149 50 141 80 143 S130 131 160 134 S205 121 235 123 S290 106 320 108 S350 99 360 96" fill="none" stroke="#ff5b2e" stroke-width="2.5" stroke-linecap="round"/>
</g>
</svg>