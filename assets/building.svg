<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Now building: TradeDesk">
<style>
  .t { font: 800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: -1px; } .t tspan { fill: #ff5b2e; }
  .k { font: 700 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ff5b2e; letter-spacing: 3px; }
  .p { font: 500 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #b8bec9; }
  .chip { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e8eaee; }
  .line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 2.6s .4s cubic-bezier(.4,0,.2,1) infinite alternate; }
  @keyframes d { to { stroke-dashoffset: 0; } }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: b 2.4s ease-in-out infinite alternate; }
  .b2 { animation-delay: .2s; } .b3 { animation-delay: .4s; } .b4 { animation-delay: .6s; } .b5 { animation-delay: .8s; } .b6 { animation-delay: 1s; }
  @keyframes b { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
  .live { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
</style>
<defs>
  <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5b2e" stop-opacity=".32"/><stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/></linearGradient>
  <pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="260" rx="22" fill="#0d0f12"/>
<rect width="1200" height="260" rx="22" fill="url(#dot)"/>
<circle cx="74" cy="58" r="6" fill="#34d399"/><circle class="live" cx="74" cy="58" r="6" fill="#34d399"/>
<text class="k" x="92" y="64">NOW BUILDING</text>
<text class="t" x="64" y="122">Trade<tspan>Desk</tspan></text>
<text class="p" x="64" y="160">A calm, private trading journal. Drop in a broker statement,</text>
<text class="p" x="64" y="186">it checks the maths and updates your dashboard.</text>
<g transform="translate(64 208)">
  <rect width="150" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text class="chip" x="75" y="21" text-anchor="middle">FastAPI + Postgres</text>
  <rect x="162" width="122" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text class="chip" x="223" y="21" text-anchor="middle">Vanilla JS</text>
  <rect x="296" width="150" height="32" rx="16" fill="#ff5b2e" fill-opacity=".16" stroke="#ff5b2e" stroke-opacity=".45"/><text class="chip" x="371" y="21" text-anchor="middle" fill="#ff5b2e">v3.7 · live</text>
</g>
<g transform="translate(700 36)">
  <rect width="440" height="190" rx="16" fill="#16191e" stroke="#fff" stroke-opacity=".08"/>
  <text x="22" y="34" style="font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b919c; letter-spacing: 2px">NET ASSET VALUE</text>
  <text x="22" y="66" style="font: 800 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff">RM 8,484.08</text>
  <path d="M22 150 C60 146 80 132 110 134 S160 116 190 120 S240 96 270 100 S330 70 360 66 S400 48 418 44 L418 168 L22 168Z" fill="url(#a)"/>
  <path class="line" d="M22 150 C60 146 80 132 110 134 S160 116 190 120 S240 96 270 100 S330 70 360 66 S400 48 418 44" fill="none" stroke="#ff5b2e" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(300 18)" fill="#fff" fill-opacity=".85">
    <rect class="bar" x="0" y="14" width="12" height="20" rx="3"/><rect class="bar b2" x="18" y="6" width="12" height="28" rx="3" fill="#ff5b2e"/>
    <rect class="bar b3" x="36" y="10" width="12" height="24" rx="3"/><rect class="bar b4" x="54" y="0" width="12" height="34" rx="3" fill="#ff5b2e"/>
    <rect class="bar b5" x="72" y="8" width="12" height="26" rx="3"/><rect class="bar b6" x="90" y="2" width="12" height="32" rx="3" fill="#ff5b2e"/>
  </g>
</g>
</svg>