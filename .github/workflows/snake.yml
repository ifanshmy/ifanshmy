name: Contribution snake

# Redraws the animated contribution snake on the profile once a day (and on demand).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#a855f7&color_dots=#ebedf0,#b8f0e6,#5fd8c6,#8b7cf6,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#134e4a,#0f9f8f,#7e57e0,#a855f7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
