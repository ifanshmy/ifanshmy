name: Contribution snake

# Redraws the animated contribution snake on the profile once a day (and on demand).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#6f8f1a&color_dots=#ebedf0,#eef6c2,#cfe57a,#a6c83a,#6f8f1a
            dist/snake-dark.svg?palette=github-dark&color_snake=#d9f05a&color_dots=#161b22,#2c3512,#55691f,#93b53a,#d9f05a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
