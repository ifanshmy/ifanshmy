name: Contribution snake

# Redraws the animated contribution snake on the profile once a day (and on demand).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#4b3fd0&color_dots=#ebedf0,#e9edc0,#c9b8ff,#8a78f0,#4b3fd0
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#2b2560,#4b3fd0,#9d88ff,#eef59a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
