name: Contribution snake

# Redraws the animated contribution snake on the profile once a day (and on demand).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#ff5b2e&color_dots=#ebedf0,#ffd7c9,#ffab8f,#ff7a50,#e4461b
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5b2e&color_dots=#161b22,#4a2216,#7a2f17,#c2380f,#ff5b2e
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
