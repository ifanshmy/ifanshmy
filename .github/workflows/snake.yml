name: Contribution snake

# Redraws the animated contribution snake on the profile once a day (and on demand).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#8e2de2&color_dots=#ebedf0,#ffc9c2,#ff7a6b,#d6336c,#8e2de2
            dist/snake-dark.svg?palette=github-dark&color_snake=#b868f5&color_dots=#161b22,#5b1d2a,#a3263f,#c42f8c,#8e2de2
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
